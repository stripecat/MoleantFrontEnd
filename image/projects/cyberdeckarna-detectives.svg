<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two cartoon detectives with a magnifying glass looking at a bug on a circuit board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a161d"/>
      <stop offset="1" stop-color="#10303a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#11db76" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#11db76" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- circuit board -->
  <g fill="none" stroke="#1f6b4a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M0 70 H120 L150 40 H260"/>
    <path d="M0 120 H70 L100 150 H180"/>
    <path d="M380 30 H470 L500 60 H640"/>
    <path d="M440 110 H560 L590 80 H640"/>
    <path d="M0 330 H90 L120 360 H230"/>
    <path d="M400 370 H500 L530 340 H640"/>
    <path d="M300 20 V70 L330 100"/>
  </g>
  <g fill="#11db76" opacity="0.8">
    <circle cx="260" cy="40" r="5"/><circle cx="180" cy="150" r="5"/><circle cx="640" cy="60" r="5"/>
    <circle cx="230" cy="360" r="5"/><circle cx="330" cy="100" r="5"/><circle cx="560" cy="80" r="5"/>
  </g>

  <!-- the spot they are investigating -->
  <circle cx="470" cy="215" r="130" fill="url(#glow)"/>

  <!-- floor -->
  <rect x="0" y="338" width="640" height="62" fill="#07111a"/>
  <rect x="0" y="338" width="640" height="3" fill="#11db76" opacity="0.6"/>

  <!-- detective on the left: deerstalker hat, tan trench coat -->
  <g>
    <ellipse cx="190" cy="342" rx="62" ry="9" fill="#000" opacity="0.35"/>
    <rect x="160" y="300" width="22" height="40" rx="6" fill="#2a2f45"/>
    <rect x="198" y="300" width="22" height="40" rx="6" fill="#2a2f45"/>
    <path d="M138 318 Q132 232 168 214 H212 Q248 232 242 318 Z" fill="#c9a768"/>
    <path d="M190 214 V318" stroke="#a88646" stroke-width="3"/>
    <circle cx="190" cy="250" r="3.5" fill="#a88646"/><circle cx="190" cy="278" r="3.5" fill="#a88646"/>
    <path d="M168 214 L190 238 L212 214 Z" fill="#e8d3a0"/>
    <!-- arm pointing right -->
    <path d="M232 236 Q262 232 292 214" fill="none" stroke="#c9a768" stroke-width="20" stroke-linecap="round"/>
    <circle cx="298" cy="210" r="11" fill="#f2c9a0"/>
    <!-- head -->
    <circle cx="190" cy="178" r="36" fill="#f2c9a0"/>
    <path d="M150 168 Q152 128 190 124 Q228 128 230 168 Q210 156 190 156 Q170 156 150 168 Z" fill="#7a5a34"/>
    <path d="M146 166 Q190 150 234 166 L234 172 Q190 158 146 172 Z" fill="#5d4326"/>
    <path d="M176 126 Q190 108 204 126 Z" fill="#5d4326"/>
    <circle cx="177" cy="182" r="4.5" fill="#1a1a1a"/><circle cx="203" cy="182" r="4.5" fill="#1a1a1a"/>
    <circle cx="178.5" cy="180.5" r="1.4" fill="#fff"/><circle cx="204.5" cy="180.5" r="1.4" fill="#fff"/>
    <path d="M176 198 Q190 210 204 198" fill="none" stroke="#7a3b2a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- detective on the right: fedora, purple coat, holds the magnifying glass -->
  <g>
    <ellipse cx="380" cy="342" rx="56" ry="9" fill="#000" opacity="0.35"/>
    <rect x="354" y="304" width="20" height="36" rx="6" fill="#222638"/>
    <rect x="388" y="304" width="20" height="36" rx="6" fill="#222638"/>
    <path d="M334 322 Q330 240 362 222 H400 Q432 240 428 322 Z" fill="#5b3fa6"/>
    <path d="M381 222 V322" stroke="#40297e" stroke-width="3"/>
    <path d="M362 222 L381 244 L400 222 Z" fill="#8e78d6"/>
    <!-- arm holding the glass -->
    <path d="M418 244 Q450 252 478 238" fill="none" stroke="#5b3fa6" stroke-width="20" stroke-linecap="round"/>
    <circle cx="486" cy="236" r="11" fill="#a86f4c"/>
    <!-- head -->
    <circle cx="381" cy="190" r="34" fill="#a86f4c"/>
    <path d="M338 176 H424 L416 164 Q381 150 346 164 Z" fill="#232338"/>
    <path d="M356 164 Q356 134 381 132 Q406 134 406 164 Z" fill="#232338"/>
    <rect x="356" y="156" width="50" height="8" fill="#11db76"/>
    <circle cx="368" cy="194" r="4.5" fill="#1a1a1a"/><circle cx="394" cy="194" r="4.5" fill="#1a1a1a"/>
    <circle cx="369.5" cy="192.5" r="1.4" fill="#fff"/><circle cx="395.5" cy="192.5" r="1.4" fill="#fff"/>
    <path d="M370 208 Q381 218 392 208" fill="none" stroke="#4a2417" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- magnifying glass over a bug -->
  <g>
    <line x1="520" y1="268" x2="560" y2="318" stroke="#caa24a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="500" cy="236" r="52" fill="#0b2a2a" fill-opacity="0.55" stroke="#11db76" stroke-width="9"/>
    <path d="M470 214 Q482 200 502 200" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <!-- the bug -->
    <g transform="translate(500 240)">
      <ellipse rx="19" ry="23" fill="#e5384f"/>
      <line x1="0" y1="-23" x2="0" y2="23" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="-8" cy="-6" r="4" fill="#1a1a1a"/><circle cx="9" cy="5" r="4" fill="#1a1a1a"/><circle cx="-7" cy="12" r="3" fill="#1a1a1a"/>
      <circle cy="-27" r="9" fill="#1a1a1a"/>
      <path d="M-5 -34 L-11 -45 M5 -34 L11 -45" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-18 -8 L-32 -14 M-19 4 L-34 6 M-17 16 L-30 24 M18 -8 L32 -14 M19 4 L34 6 M17 16 L30 24" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- a padlock and some bits floating around -->
  <g transform="translate(70 215) rotate(-12)">
    <path d="M-14 -4 V-18 A14 14 0 0 1 14 -18 V-4" fill="none" stroke="#d4ac50" stroke-width="6"/>
    <rect x="-22" y="-6" width="44" height="34" rx="6" fill="#d4ac50"/>
    <circle cy="8" r="5" fill="#0a161d"/><rect x="-2" y="8" width="4" height="12" rx="2" fill="#0a161d"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#11db76" opacity="0.7">
    <text x="30" y="40">01100011</text>
    <text x="520" y="40">10110</text>
    <text x="560" y="380">1001</text>
  </g>
  <text x="590" y="150" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#cc51b7" opacity="0.9">?</text>
</svg>
